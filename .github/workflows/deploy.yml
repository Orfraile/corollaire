# Mise en ligne automatique du blog sur GitHub Pages.
# À chaque envoi de tes modifications sur GitHub (branche « main »),
# GitHub construit le site puis le publie tout seul.

name: Mise en ligne du blog

on:
  push:
    branches: [main]
  # Permet aussi de le lancer à la main depuis l'onglet « Actions » de GitHub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le contenu du dépôt
        uses: actions/checkout@v6
      - name: Construire le site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
